---
exclude_paths:
  - bin
  - config
  - db
  - log
  - public
  - test
  - storage
  - tmp
  - vendor

detectors:
  UtilityFunction:
    exclude:
      # Private query builder shared by the class's two other private methods;
      # splitting it into a separate object would just add a file for no reuse.
      - Entry::RelatedResources#base_query
      # Deliberately a stateless class method (see AuthorProposal::UrlMatching)
      # so it's reusable without an instance; that's the point, not a smell.
      - AuthorProposal::UrlMatching#normalize_url
      # Prosopite's own documented around_action pattern
      # (https://github.com/charkost/prosopite#development-environment-usage);
      # scan/finish don't touch instance state by design.
      - ApplicationController#n_plus_one_detection

  TooManyStatements:
    exclude:
      # Was 3 methods (call/extract_username/construct_avatar_url) split
      # purely to keep each one short - the actual over-engineering pass
      # (docs/llms/development.md) merged them back into one linear guard-
      # clause method. Re-splitting to satisfy this count would undo that.
      - GithubAvatarService#call

  MissingSafeMethod:
    exclude:
      # These bang methods are the only entry point on purpose - there is no
      # "safe" boolean-returning variant we want to expose.
      - AuthorProposal::Approvable#approve!
      - AuthorProposal::Approvable#reject!
      - AuthorProposal::Approvable#create_new_author!

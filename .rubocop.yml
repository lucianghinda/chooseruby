# yaml-language-server: $schema=https://www.rubyschema.org/rubocop.json
%YAML 1.1
---
# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-performance
  - rubocop-minitest
  - rubocop-thread_safety

# Omakase loads Performance but disables all except Performance/FlatMap.
Performance:
  Enabled: true

# Catch tests that silently stop running or checking the intended behavior.
Minitest/Focus:
  Enabled: true

Minitest/NonExecutableTestMethod:
  Enabled: true

Minitest/NonPublicTestMethod:
  Enabled: true

Minitest/UnreachableAssertion:
  Enabled: true

Minitest/UnspecifiedException:
  Enabled: true

Minitest/UselessAssertion:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always_true
